<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Automated Grading System</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="bgParticles"></canvas>

<div class="container">
    <div class="header">
        <h1>Automated Short Answer Grading</h1>
        <p>Grade answers instantly with AI-powered scoring!</p>
    </div>

    <div class="input-grid">
        <div class="glass-card">
            <textarea id="question" placeholder=" "></textarea>
            <label>Question</label>
        </div>

        <div class="glass-card">
            <textarea id="model_answer" placeholder=" "></textarea>
            <label>Model Answer</label>
        </div>

        <div class="glass-card">
            <textarea id="student_answer" placeholder=" "></textarea>
            <label>Student Answer</label>
        </div>
    </div>

    <button id="gradeBtn">Grade Answer</button>

    <div class="score-circle">
        <svg width="220" height="220">
            <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ff416c"/>
                    <stop offset="50%" stop-color="#ff4b2b"/>
                    <stop offset="100%" stop-color="#00c6ff"/>
                </linearGradient>
            </defs>
            <circle cx="110" cy="110" r="100" stroke="#eee" stroke-width="18" fill="none" opacity="0.1"/>
            <circle id="progressCircle" cx="110" cy="110" r="100" stroke="url(#gradient)" stroke-width="18" fill="none"
                    stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="628"/>
        </svg>
        <div class="score-text" id="scoreText">0%</div>
    </div>

    <canvas id="confetti"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
